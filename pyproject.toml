[project]
name = "vibecmake"
version = "0.1.0"
description = "A modern GUI for CMake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["qtpy>=2.4", "PySide6>=6.7"]

[project.gui-scripts]
vibecmake = "vibecmake.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vibecmake*"]

[tool.setuptools.package-data]
vibecmake = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
